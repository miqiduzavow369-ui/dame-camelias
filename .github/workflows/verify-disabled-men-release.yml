name: Verify disabled 30-men ADMIN release (no deployment)
on:
  push:
    branches:
      - release/30-men-admin-disabled-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing Worker and all release modules
        run: |
          for file in src/index.js src/owner_anketa.js src/cabinet_runtime.js src/admin_app_api.js src/man_accounts.js src/man_account_isolation.js src/man_setup_state.js src/man_setup_store.js src/man_admin_registry.js; do
            node --experimental-default-type=module --check "$file"
          done
      - name: Static first-man invariants and safe admin HTML
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const owner=fs.readFileSync('src/owner_anketa.js','utf8');
          assert.match(owner,/const ACTIVE_ACCOUNT = "yan_first"/);
          const accounts=await import('./src/man_accounts.js');
          assert.equal(accounts.MAN_ACCOUNTS.length,30);
          assert.equal(accounts.MAN_ACCOUNTS.filter(x=>x.enabledByDefault).length,1);
          assert.equal(accounts.MAN_ACCOUNTS[0].id,'yan_first');
          const html=fs.readFileSync('admin/preview-v3.html','utf8');
          const js=html.split('<script>')[1]?.split('</script>')[0];
          assert.ok(js,'admin script missing');
          new vm.Script(js);
          JS
      - name: Bundle existing production worker without deploying
        run: npx --yes wrangler@4.102.0 deploy --config wrangler.toml --dry-run --outdir /tmp/dame-existing-worker-release
