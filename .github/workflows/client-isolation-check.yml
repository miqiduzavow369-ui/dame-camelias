name: Multi-client isolation checks
on:
  push:
    branches:
      - feat/multi-client-isolation-foundation
    paths:
      - src/client_isolation.js
      - tests/client_isolation.test.mjs
      - .github/workflows/client-isolation-check.yml
  pull_request:
    paths:
      - src/client_isolation.js
      - tests/client_isolation.test.mjs
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/client_isolation.js
      - run: node --test tests/client_isolation.test.mjs tests/trial_cabinet.test.mjs
