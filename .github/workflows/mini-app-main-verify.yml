name: Verify production Mini App changes
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'anketa/**'
      - 'tests/**'
      - '.github/workflows/mini-app-main-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check src/index.js && node --check src/cabinet_runtime.js && node --check src/owner_anketa.js
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m py_compile tools/*.py
