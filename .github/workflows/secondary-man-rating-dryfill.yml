name: Secondary rating dryfill
on:
  workflow_dispatch:
    inputs:
      account_id:
        required: true
        type: string
      user_id:
        required: true
        type: string
      profile_id:
        required: true
        type: string
      nonce:
        required: true
        type: string
      site_host:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Prepare existing Chromium runtime
        uses: ./.github/actions/secondary-browser-runtime
      - name: Verify rating form without submitting
        env:
          ANKETA_CALLBACK_URL: https://dame-camelias.gptjjjgpt.workers.dev/api/anketa/result
          ANKETA_CALLBACK_TOKEN: ${{ secrets.ANKETA_CALLBACK_TOKEN }}
          SECONDARY_ACCOUNT_ID: ${{ inputs.account_id }}
          SECONDARY_USER_ID: ${{ inputs.user_id }}
          SECONDARY_PROFILE_ID: ${{ inputs.profile_id }}
          SECONDARY_DRYFILL_NONCE: ${{ inputs.nonce }}
          SECONDARY_SITE_HOST: ${{ inputs.site_host }}
        run: python tools/secondary_man_rating_dryfill_job.py

