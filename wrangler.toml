name = "dame-camelias"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Request Git-linked rebuild for read-only finance history in Mini App (2026-10-17)

# Daily visitor summaries: 10:00, 16:00, 22:00 Moscow (UTC+3)
[triggers]
crons = ["0 7 * * *", "0 13 * * *", "0 19 * * *"]

# Profile thumbnails share existing VISITORS_KV namespace (no R2 bucket required).
[[kv_namespaces]]
binding = "VISITORS_KV"
id = "a323fba4c8c84a7fb37e1e6a3a8264aa"

[[durable_objects.bindings]]
name = "ORDER_REMINDERS"
class_name = "OrderReminder"

[[migrations]]
tag = "order-reminders-v1"
new_sqlite_classes = ["OrderReminder"]

# Owner-approved publication testing with manual confirmation in Telegram.
[vars]
CABINET_CLIENTS_ENABLED = "true"
CABINET_PUBLICATIONS_ENABLED = "true"

