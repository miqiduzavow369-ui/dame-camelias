name: Trial cabinet safety checks
on:
  push:
    branches:
      - feat/trial-client-cabinet-5627932577
    paths:
      - src/index.js
      - src/trial_cabinet.js
      - tests/trial_cabinet.test.mjs
      - .github/workflows/trial-cabinet-check.yml
  workflow_dispatch:
  pull_request:
    paths:
      - src/index.js
      - src/trial_cabinet.js
      - tests/trial_cabinet.test.mjs
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/trial_cabinet.js && node --check src/index.js
      - run: node --test tests/trial_cabinet.test.mjs
