name: Check man retry diagnostics
on:
  push:
    branches: [feature/man-check-errors-retry-20261018]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/man_check_diagnostics.test.mjs
      - run: npx --yes wrangler@4 deploy --config wrangler.toml --dry-run
