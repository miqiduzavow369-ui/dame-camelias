name: Intimcity login smoke test (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify browser proxy and login (no posting)
        env:
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          EXPECTED_EGRESS_IP: ${{ secrets.EXPECTED_EGRESS_IP }}
          INTIMCITY_LOGIN: ${{ secrets.INTIMCITY_LOGIN }}
          INTIMCITY_PASSWORD: ${{ secrets.INTIMCITY_PASSWORD }}
        run: python tools/intimcity_login_smoke_test.py
