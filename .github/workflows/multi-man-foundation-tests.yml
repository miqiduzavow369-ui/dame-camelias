name: Verify 30-man foundation (no deployment)

on:
  push:
    branches:
      - feature/yan-multiaccount-foundation
    paths:
      - 'src/man_*.js'
      - 'wrangler.man-staging.toml'
      - 'src/admin_app_api.js'
      - 'src/cabinet_runtime.js'
      - 'admin/preview-v3.html'
      - 'tests/man_*.test.js'
      - '.github/workflows/multi-man-foundation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-man-foundation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source checks and isolated unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify core server module syntax
        run: |
          node --experimental-default-type=module --check src/man_accounts.js
          node --experimental-default-type=module --check src/man_account_isolation.js
          node --experimental-default-type=module --check src/man_setup_state.js
          node --experimental-default-type=module --check src/man_setup_store.js
          node --experimental-default-type=module --check src/man_global_locks.js
          node --experimental-default-type=module --check src/man_operation_route.js
          node --experimental-default-type=module --check src/man_executor_contract.js
          node --experimental-default-type=module --check src/man_mock_queue.js
          node --experimental-default-type=module --check src/man_mock_queue_view.js
          node --experimental-default-type=module --check src/man_staging_dashboard.js
          node --experimental-default-type=module --check src/man_admin_registry.js
          node --experimental-default-type=module --check src/man_staging_worker.js
          node --experimental-default-type=module --check src/man_staging_auth.js
          node --experimental-default-type=module --check src/admin_app_api.js
          node --experimental-default-type=module --check src/cabinet_runtime.js
      - name: Run 30-man foundation regression suite
        run: |
          node --experimental-default-type=module --test tests/man_accounts.test.js tests/man_account_isolation.test.js tests/man_admin_registry.test.js tests/man_setup_state.test.js tests/man_setup_store.test.js tests/man_integration_boundaries.test.js tests/man_admin_http_integration.test.js tests/man_staging_worker.test.js tests/man_admin_ui_races.test.js tests/man_global_locks.test.js tests/man_operation_route.test.js tests/man_executor_contract.test.js tests/man_mock_queue.test.js tests/man_staging_queue.test.js tests/man_mock_queue_view.test.js tests/man_staging_ui_races.test.js tests/man_staging_auth.test.js tests/man_staging_html.test.js tests/man_staging_deploy_contract.test.js
      - name: Bundle isolated staging Worker without publishing
        run: |
          npx --yes wrangler@4.102.0 deploy --config wrangler.man-staging.toml --dry-run --outdir /tmp/dame-camelias-man-staging-bundle
          find /tmp/dame-camelias-man-staging-bundle -type f -name '*.js' -size +0c | grep -q .
      - name: Validate admin inline JavaScript syntax
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import vm from "node:vm"; const html=fs.readFileSync("admin/preview-v3.html","utf8");const js=html.split("<script>")[1]?.split("</script>")[0];if(!js)throw Error("ADMIN inline script not found");new vm.Script(js);'
# No Cloudflare deployment, site automation, credentials, or proxy calls.
