name: Deploy existing DAME CAMELIAS Worker
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'anketa/**'
      - '.github/workflows/deploy-existing-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dame-camelias-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing Cloudflare deployment credentials
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN was not provided to this workflow job (check repository/environment secret scope)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID was not provided to this workflow job (check repository/environment secret scope)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Deployment stopped before authentication; no credentials were printed."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check src/index.js && node --check src/cabinet_runtime.js && node --check src/reminders.js && node --check src/publication_credits.js
      - name: Deploy only the existing configured Worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
