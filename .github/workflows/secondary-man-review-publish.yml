name: Secondary man owner-approved review (one attempt)
on:
  workflow_dispatch:
    inputs:
      account_id:
        required: true
        type: string
      user_id:
        required: true
        type: string
      profile_id:
        required: true
        type: string
      nonce:
        required: true
        type: string
      callback_ticket:
        required: true
        type: string
      site_host:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: "secondary-review-${{ inputs.account_id }}-${{ inputs.user_id }}-${{ inputs.profile_id }}"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified Playwright browser
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Execute one author-confirmed review and verify evidence
        env:
          ANKETA_CALLBACK_URL: https://dame-camelias.gptjjjgpt.workers.dev/api/anketa/result
          ANKETA_CALLBACK_TOKEN: ${{ secrets.ANKETA_CALLBACK_TOKEN }}
          SECONDARY_CALLBACK_HMAC_KEY: ${{ secrets.SECONDARY_CALLBACK_HMAC_KEY }}
          SECONDARY_ACCOUNT_ID: ${{ inputs.account_id }}
          SECONDARY_USER_ID: ${{ inputs.user_id }}
          SECONDARY_PROFILE_ID: ${{ inputs.profile_id }}
          SECONDARY_REVIEW_NONCE: ${{ inputs.nonce }}
          SECONDARY_CALLBACK_TICKET: ${{ inputs.callback_ticket }}
          SECONDARY_SITE_HOST: ${{ inputs.site_host }}
        run: python tools/secondary_man_review_job.py
