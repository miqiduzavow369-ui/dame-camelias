 h=`${back("go('reviews')")}<h1>Решение по отзыву</h1><p class="small muted">Анкета №${esc(x.profileId)} · ${esc(accountName(x.account))}</p><div class="card"><span class="decision-tag ${x.status==='rejected'?'rejected':'approved'}">${x.status==='rejected'?'Отклонено':x.status==='published'?'Опубликовано':'Одобрено'}</span><div class="small muted" style="margin-top:12px">Клиентка · ID ${esc(x.userId)} · ${esc(x.username?'@'+x.username:'ник не указан')}</div><div class="small muted">Решение: ${esc(x.decidedAt?new Date(x.decidedAt).toLocaleString('ru-RU'):archiveDate(x.date))}</div>${x.text?'<div class="section">Текст отзыва</div><div class="reviewtext">'+esc(x.text)+'</div>':''}${x.corrected?'<div class="thin"></div><div class="small muted">Текст скорректирован администратором</div><div class="reviewtext">'+esc(x.originalText||'')+'</div>':''}</div>${x.proof?'<button class="archive-compact" onclick="openHistoryProof('+state.reviewIndex+')">▤ Посмотреть подтверждение ›</button>':''}`;

else if(p==='proof'){let x=archive[state.proof];if(!x){go('reviews');return;}h=`${back(state.fromReviews?"go('reviews')":"go('archive')")}<h1>Подтверждение</h1><div class="card"><strong>${x.kind} · анкета №${esc(x.profile)}</strong><div class="light">${esc(accountName(x.account))} · ${esc(archiveDate(x.date))}</div><div class="thin"></div><div class="fakeproof">▧<div>${x.proof?'<button class="secondary" onclick="loadProof()">Открыть скриншот</button><div id="proof-image" class="hint">Изображение загружается по запросу</div>':'Скриншот не сохранён в архиве'}</div></div></div>`;}
else if(p==='form'){h=formContent()}
else if(p==='confirm'){h=confirmContent()}
el.innerHTML=h;}
function searchClients(v){const focused=document.activeElement;state.query=v;let position=focused.selectionStart;render();const input=document.getElementById('search');if(input){input.focus();input.setSelectionRange(position,position)}}
function searchArchive(v){state.archquery=v;render();const input=el.querySelector('input');if(input){input.focus();input.setSelectionRange(v.length,v.length)}}
function filterReviews(v){state.filter=v;render()}
function startAdd(){pendingOperation=null;state.wizard={id:'',pin:'',grant:''};state.action='create';state.step=0;go('form')}
function startAction(type){pendingOperation=null;if(['approve','reject','edit'].includes(type))return toast('Модерация пока доступна в прежнем ADMIN.');state.action=type;state.field='';state.ack='';state.step=0;go(type==='access'||type==='approve'||type==='reject'?'confirm':'form')}
function actionTitle(){return ({create:'Добавить клиентку',topup:'Пополнить баланс',balance:'Изменить остаток',pin:'Новый код доступа',access:'Изменить доступ',approve:'Опубликовать отзыв',reject:'Отклонить отзыв',edit:'Скорректировать'})[state.action]}
function formContent(){let t=state.action,field=state.field;let h=`${back(t==='create'?"root('clients')":t==='edit'?"go('review')":"go('client')")}<h1>${actionTitle()}</h1>`;
if(t==='create'){let steps=[['Telegram ID','Введите числовой Telegram ID клиентки','numeric'],['Код доступа','Назначьте код из 6–12 цифр','numeric'],['Начальный баланс','Количество публикаций от 0 до 1 000 000','numeric']];let [label,hint,keyboard]=steps[state.step];let key=['id','pin','grant'][state.step];h+=`<p class="muted small">Шаг ${state.step+1} из 3</p><div class="card"><label>${label}</label><input class="field" inputmode="${keyboard}" type="${key==='pin'?'password':'text'}" id="entry" value="${esc(state.wizard[key])}" placeholder="${esc(hint)}" oninput="state.wizard['${key}']=this.value"><div class="hint">${hint}</div><div id="err" class="error"></div>${b(state.step===2?'Проверить и подтвердить':'Продолжить','nextCreate()','primary')}</div>`;}
if(['topup','balance','pin'].includes(t)){let label=t==='pin'?'Новый код (6–12 цифр)':t==='topup'?'Сколько публикаций добавить?':'Новый доступный остаток';h+=`<p class="small muted">Клиентка ${esc(state.client)}</p><div class="card"><label>${label}</label><input class="field" id="entry" ${t==='pin'?'type="password"':''} inputmode="numeric" placeholder="Введите значение" value="${esc(state.field)}" oninput="state.field=this.value"><div class="hint">${t==='balance'?'Текущий остаток и уже использованные публикации учитываются отдельно.':t==='topup'?'Добавление публикаций, не замена остатка.':'После изменения потребуется повторный вход.'}</div><div id="err" class="error"></div>${b('Проверить и подтвердить',"validateAction()",'primary')}</div>`;}
if(t==='edit'){let x=reviews.find(x=>x.id===state.review);h+=`<p class="muted small">Анкета №${x.profile}</p><div class="card"><label>Исправленный текст</label><textarea class="field" id="entry" oninput="state.editor=this.value">${esc(state.editor||x.text)}</textarea><div id="err" class="error"></div>${b('Проверить корректировку',"validateEdit()",'primary')}</div>`;}
return h;}
function fail(text){let e=document.getElementById('err');if(e)e.textContent=text}
function nextCreate(){let w=state.wizard,k=['id','pin','grant'][state.step],v=document.getElementById('entry').value;w[k]=v;if(k==='id'&&(!/^[1-9]\d{4,15}$/.test(v)||clients.some(c=>c.id===v))){fail('Проверьте ID: требуется уникальный числовой Telegram ID.');return}if(k==='pin'&&!/^\d{6,12}$/.test(v)){fail('Код должен содержать 6–12 цифр.');return}if(k==='grant'&&(!/^\d+$/.test(v)||+v>1000000)){fail('Введите целое число от 0 до 1 000 000.');return}if(state.step<2){state.step++;render()}else go('confirm')}
function validateAction(){let t=state.action,v=document.getElementById('entry').value;state.field=v;if(t==='pin'&&!/^\d{6,12}$/.test(v))return fail('Код должен содержать 6–12 цифр.');if(t!=='pin'&&(!/^\d+$/.test(v)||+v>1000000||(t==='topup'&&+v===0)))return fail('Проверьте целое число в допустимом диапазоне.');go('confirm')}
function validateEdit(){let v=document.getElementById('entry').value.trim();if(v.length<10||v.length>3000)return fail('Текст отзыва должен содержать от 10 до 3000 символов.');state.editor=v;go('confirm')}
function confirmContent(){let t=state.action,c=cby(state.client),x=reviews.find(y=>y.id===state.review);let intro='';if(t==='create')intro=`ID: ${state.wizard.id}<br>Начальный баланс: ${state.wizard.grant}<br>Код: ••••••`;if(t==='topup')intro=`${username(c)} · ID ${esc(c.id)}<br>Добавить: <b>${state.field}</b> публикаций<br>Остаток сейчас: ${available(c)}`;if(t==='balance')intro=`${username(c)} · ID ${esc(c.id)}<br>Сейчас: ${available(c)}<br>Установить: <b>${state.field}</b>`;if(t==='pin')intro=`${username(c)} · ID ${esc(c.id)}<br>Изменить код доступа`;if(t==='access')intro=`${username(c)} · ID ${esc(c.id)}<br>${c.active?'Приостановить доступ':'Восстановить доступ'}`;if(['approve','reject','edit'].includes(t))intro=`Анкета №${x.profile}<br>${x.account}<br>${t==='edit'?'Сохранить исправленный текст':t==='approve'?'Подтвердить публикацию':'Отклонить отзыв'}`;let returnTo=t==='create'?"root('clients')":['edit','approve','reject'].includes(t)?"go('review')":"go('client')";return `${back(returnTo)}<h1>Подтверждение</h1><p class="muted small">${actionTitle()}</p><div class="card" style="line-height:1.9">${intro}</div><div class="note">Операция будет записана в существующую систему после подтверждения.</div>${b('Подтвердить',"commitLive()",'primary')}<div style="height:9px"></div>${b('Отмена',returnTo)}`}

const auth=()=>window.Telegram?.WebApp?.initData||'';
function openManDetail(id){if(!manAccounts.some(x=>x.id===id))return;selectedManId=id;menHistory=[];menHistoryError='';go('man-detail');reloadManHistory(id)}
async function reloadManHistory(id=selectedManId){
 if(!id||id==='yan_first'){menHistory=[];return}
 try{
  const r=await callAdmin('man_setup_history',{accountId:id});
  if(!Array.isArray(r.items))throw Error('История недоступна');
  if(selectedManId!==id)return;
  menHistory=r.items;menHistoryError='';
 }catch(e){if(selectedManId!==id)return;menHistory=[];menHistoryError='Не удалось загрузить историю'}
 if(state.page==='man-detail')render();
}
async function changeManPlanning(action){
 if(menChanging||!selectedManId||selectedManId==='yan_first')return;
 const x=manAccounts.find(m=>m.id===selectedManId),expectedVersion=x?.setup?.version;
 if(!x||!Number.isSafeInteger(expectedVersion)||!['plan','reset'].includes(action))return;
 menChanging=true;render();
 try{
  const result=await callAdmin('man_setup_draft',{accountId:selectedManId,expectedVersion,setupAction:action});
  if(!result.setup||result.setup.accountId!==selectedManId||result.setup.canPublish!==false)throw Error('Некорректный ответ сервера');
  const current=manAccounts.findIndex(m=>m.id===selectedManId);
  if(current>=0)manAccounts[current]={...manAccounts[current],setup:result.setup,connection:result.setup.stage};
  toast(action==='plan'?'Подготовка начата':'Статус подготовки сброшен');
  await reloadManHistory(selectedManId);
 }catch(e){toast('Статус не обновлён: '+e.message);await reloadMen()}
 finally{menChanging=false;render()}
}
async function reloadMen(){
 if(menBusy)return;menBusy=true;menError='';
 try{const r=await callAdmin('man_accounts');if(r.readOnly!==true||!Array.isArray(r.accounts)||r.accounts.length!==30)throw Error('Реестр недоступен');manAccounts=r.accounts}
 catch(e){manAccounts=[];menError='Ошибка загрузки: '+e.message}
 finally{menBusy=false;if(state.page==='men')render()}
}
function searchMen(v){menQuery=v;render();const i=document.getElementById('men-search');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}
async function callAdmin(action,payload={}){
 if(!auth())throw Error('Откройте ADMIN из вашего Telegram-бота');
 const response=await fetch('/api/admin/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:auth(),action,...payload}),cache:'no-store'});
 const data=await response.json().catch(()=>({reason:'network_error'}));
 if(!response.ok||!data.ok)throw Error(data.reason||'operation_unavailable');
 return data;
}
async function reloadClients(){
 try{
  const data=await callAdmin('clients');
  clients=data.clients.filter(c=>!c.financeUnavailable).map(c=>({...c,username:c.username||null,agreement:false}));
  state.page='clients';render();
 }catch(e){clients=[];reviews=[];render();toast('ADMIN недоступен: '+e.message)}
}
async function openVisitor(event,id){
 event.preventDefault();
 const href=event.currentTarget.href;
 const entry=visitorEvents.find(x=>x.id===id);
 if(entry?.unread){
  // Save the acknowledgement before leaving the Mini App so it survives reopening.
  try{
   const response=await fetch('/api/admin/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:auth(),action:'visitor_seen',userId:id}),cache:'no-store',signal:AbortSignal.timeout(3000)});
   if(!response.ok)throw Error('not_saved');
   entry.unread=false;
   if(state.page==='events')render();
  }catch{toast('Не удалось сохранить просмотр. Подсветка останется до следующего открытия.');}
 }
 if(href.startsWith('https://t.me/')){if(window.Telegram?.WebApp?.openTelegramLink)window.Telegram.WebApp.openTelegramLink(href);else window.location.href=href;}
 else window.location.href=href;
 return false;
}
async function reloadVisitorEvents(){
 eventsError='';
 try{const data=await callAdmin('visitors');visitorEvents=Array.isArray(data.visitors)?data.visitors:[];eventsPartial=!!data.partial;}
 catch(e){eventsError='Не удалось загрузить посещения: '+e.message;visitorEvents=[];}
 if(state.page==='events')render();
}
function filterEvents(value){eventsFilter=value;render();}
function searchEvents(value){eventsQuery=value;render();const input=document.getElementById('events-search');if(input){input.focus();input.setSelectionRange(value.length,value.length);}}
async function reloadReviewHistory(){
 historyLoadError='';historyPartial=false;
 try{
  const data=await callAdmin('review_history');
  // Display newest moderation decisions first, without altering the stored archive.
  const decisionTime=x=>{
   const decided=Number(x.decidedAt);
   if(Number.isFinite(decided)&&decided>0)return decided;
   const date=String(x.date||"");
   if(/^\\d{8}$/.test(date)){const parsed=Date.parse(date.slice(0,4)+"-"+date.slice(4,6)+"-"+date.slice(6,8)+"T00:00:00Z");return Number.isFinite(parsed)?parsed:0;}
   return 0;
  };
  reviewHistory=(data.items||[]).map(x=>({...x})).sort((a,b)=>decisionTime(b)-decisionTime(a));
  historyPartial=!!data.partial;
 }catch(e){reviewHistory=[];historyLoadError='Не удалось загрузить историю: '+e.message}
 if(state.page==='reviews')render();
}
function searchReviewHistory(value){
 state.reviewQuery=value;render();
 const input=document.getElementById('review-search');
 if(input){input.focus();input.setSelectionRange(value.length,value.length)}
}
function openReviewDecision(index){if(!reviewHistory[index])return;go('review',{reviewIndex:index})}
function openHistoryProof(index){
 const x=reviewHistory[index];if(!x)return;
 archive.length=0;
 archive.push({uid:x.userId,profile:x.profileId,account:x.account,kind:'Отзыв',kindKey:'review',date:x.date,proof:x.proof});
 go('proof',{proof:0,fromReviews:true});
}
async function openClient(id){
 try{
  const r=await callAdmin('client',{userId:id});
  const i=clients.findIndex(c=>c.id===id);
  if(i<0)throw Error('not_found');
  clients[i]={...clients[i],...r.client,agreement:r.client.agreement?.status==='accepted'};
  go('client',{client:id});
 }catch(e){toast('Не удалось открыть клиентку: '+e.message)}
}
async function loadProof(){
 const x=archive[state.proof],target=document.getElementById('proof-image');
 if(!x||!target)return;
 target.textContent='Загружаем подтверждение…';
 try{
  const response=await fetch('/api/admin/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:auth(),action:'archive_proof',userId:x.uid,profileId:x.profile,account:x.account,kind:x.kindKey}),cache:'no-store'});
  if(!response.ok||!(response.headers.get('content-type')||'').startsWith('image/')){
   const error=await response.json().catch(()=>null);
   const codes={proof_missing:'У записи нет сохранённого изображения',telegram_file_unavailable:'Telegram не выдал сохранённый файл',telegram_image_unavailable:'Telegram не отдал изображение',image_format_unavailable:'Неподдерживаемый формат изображения',invalid_image_size:'Изображение повреждено или слишком большое',forbidden:'Нет доступа'};
   throw Error(codes[error?.reason]||'Не удалось открыть скриншот ('+response.status+')');
  }
  const blob=await response.blob(),url=URL.createObjectURL(blob);
  target.innerHTML='<img alt="Подтверждение публикации" style="width:100%;height:auto;max-height:75vh;object-fit:contain;border-radius:12px">';
  target.querySelector('img').src=url;
  target.querySelector('img').onload=()=>URL.revokeObjectURL(url);
  target.querySelector('img').onerror=()=>{target.textContent='Не удалось отобразить изображение на устройстве';URL.revokeObjectURL(url)};
 }catch(e){target.textContent=e.message}
}
async function openArchive(){
 try{
  const r=await callAdmin('archive',{userId:state.client});
  archive.length=0;
  for(const x of (r.archive?.items||[]))archive.push({uid:state.client,profile:String(x.profileId||''),account:x.account||'',kind:x.kind==='rating'?'Оценка':'Отзыв',date:String(x.date||''),proof:!!x.fileId,kindKey:x.kind,fileId:null});
  go('archive',{archquery:'',fromReviews:false});
 }catch(e){toast('Не удалось открыть архив: '+e.message)}
}
let pendingOperation=null,busy=false;
function nonce16(){return Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('')}
async function commitLive(){
 if(busy)return;busy=true;
 const t=state.action,c=cby(state.client),operation=pendingOperation||(pendingOperation=nonce16());
 const button=el.querySelector('.primary');if(button)button.disabled=true;
 try{
  let action=t,payload={operation,userId:state.client};
  if(t==='create')payload={operation,userId:state.wizard.id,pin:state.wizard.pin,grant:Number(state.wizard.grant)};
  if(t==='topup')payload.amount=Number(state.field);
  if(t==='balance'){payload.target=Number(state.field);payload.expected=available(c)}
  if(t==='pin')payload.pin=state.field;
  if(t==='access')action=c.active?'suspend':'resume';
  if(!['create','topup','balance','pin','access'].includes(t))throw Error('action_not_connected');
  await callAdmin(action,payload);
  pendingOperation=null;await reloadClients();
  if(clients.some(c=>c.id===payload.userId))await openClient(payload.userId);
  toast('Изменения сохранены');
 }catch(e){toast('Ошибка сохранения: '+e.message)}
 finally{busy=false;if(button)button.disabled=false}
}
function toast(t){let old=document.querySelector('.toast');old?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.querySelector('.app').appendChild(d);setTimeout(()=>d.remove(),2400)}reloadClients();
</script></body></html>
