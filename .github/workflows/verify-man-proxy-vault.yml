name: Verify man proxy vault without deployment
on:
  push:
    branches: [feature/isolated-man-proxy-vault-20261018]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated vault tests
        run: |
          node --check src/man_proxy_vault.js
          node --check src/cabinet_runtime.js
          node --check src/admin_app_api.js
          node --test tests/man_proxy_vault.test.mjs
      - name: Existing Cloudflare Worker dry run
        run: npx --yes wrangler@4 deploy --config wrangler.toml --dry-run --outdir /tmp/dame-man-proxy-vault
