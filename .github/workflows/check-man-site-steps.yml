name: Check man site steps
on:
  push:
    branches: [feature/men-intimcity-step-gates-20261018]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/man_site_vault.test.mjs
      - run: npx --yes wrangler@4 deploy --config wrangler.toml --dry-run
