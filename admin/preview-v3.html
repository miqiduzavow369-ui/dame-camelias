<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100e12"><title>DAME CAMELIAS · ADMIN COMPACT V3</title><style>

d var(--line);border-radius:17px;background:#1c181e;overflow:hidden}.listitem{display:flex;align-items:center;gap:12px;padding:16px 14px;border:0;border-bottom:1px solid var(--line);color:inherit;background:transparent;width:100%;text-align:left}.listitem:last-child{border-bottom:0}.avatar{display:grid;place-items:center;border-radius:13px;background:#322630;border:1px solid #55404f;color:var(--gold);width:43px;height:43px;flex:none;font:20px Georgia,serif}.flex{flex:1;min-width:0}.strong{font-weight:650;font-size:14px}.nickname{color:#f0d6b2}.listitem .flex{overflow:hidden}.nickname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.light{color:#a99fa6;font-size:12px;margin-top:3px}.chev{color:var(--gold);font-size:22px}.status{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:11px}.status:before{content:'';background:#8cbd9d;border-radius:50%;width:5px;height:5px}.status.off{color:var(--red)}.status.off:before{background:var(--red)}.card{background:#1d181f;border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{border:0;padding:0 0 19px;color:var(--gold);background:transparent;font-size:13px}.summary{background:linear-gradient(135deg,#342832,#211b23);border:1px solid #55414d;border-radius:16px;padding:19px;margin:18px 0}.summary .number{font:37px Georgia,serif;color:#eed2a2;line-height:1.2;margin:7px 0 2px}.summary .minor{display:flex;gap:21px;margin-top:15px;padding-top:12px;border-top:1px solid #55434e;color:#c2b4bb;font-size:12px}.summary .minor b{color:#f1e5d8;font-weight:600}.primary{display:block;width:100%;border:0;border-radius:13px;background:linear-gradient(115deg,#ad8757,#e9d2a5,#ba9768);color:#211912;padding:14px 16px;font-weight:750;text-align:center}.secondary{display:block;width:100%;border:1px solid #655465;border-radius:12px;color:#ede0db;background:#2c232c;padding:13px 14px;text-align:center}.danger{color:#e8b2b6;border-color:#66404e;background:#301f29}.links{margin-top:9px}.linkrow{display:flex;align-items:center;gap:12px;padding:16px 1px;border:0;border-bottom:1px solid #342c37;background:transparent;color:var(--pale);width:100%;text-align:left}.linkrow:last-child{border:0}.linkico{font-size:17px;color:var(--gold);width:24px;text-align:center}.pill{background:#2c252d;border:1px solid #50414f;color:#c8b9c3;font-size:11px;border-radius:40px;padding:5px 9px}.field{display:block;width:100%;border-radius:12px;background:#242029;border:1px solid #564858;color:var(--pale);padding:13px;margin:8px 0 15px;outline:0}label{font-size:12px;color:#d3c4cb}.hint{font-size:12px;color:var(--muted);margin:10px 0 17px}.note{padding:13px;background:#29232a;border-radius:12px;border-left:2px solid #c7a678;color:#cabec5;font-size:12px;margin:15px 0}.error{color:#f1adb9;margin:12px 0;font-size:12px}.success{color:#b2d7ba;margin:12px 0;font-size:12px}.footnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#171319f5;border-top:1px solid #40333f;display:grid;grid-template-columns:1fr 1fr;padding:8px 18px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(15px);z-index:5}.navbtn{border:0;background:transparent;color:#9e959e;padding:4px;display:flex;gap:4px;flex-direction:column;align-items:center;font-size:11px}.navbtn .symbol{font-size:20px}.navbtn.active{color:#e5c794}.empty{color:#b8abb4;text-align:center;font-size:13px;padding:27px 12px}.chipbar{display:flex;gap:7px;overflow:auto;margin:17px -18px 16px;padding:0 18px}.chip{border-radius:30px;border:1px solid #534451;color:#bfaeba;background:#251e27;padding:8px 14px;white-space:nowrap;font-size:12px}.chip.selected{background:#3d302c;color:#f0d2a3;border-color:#8e7252}.reviewtext{line-height:1.7;color:#e8dee5;white-space:pre-line;margin:15px 0}.thin{height:1px;background:#3f3440;margin:16px 0}.mini{color:var(--gold);font-size:11px;letter-spacing:1.2px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actionline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.date{font-size:11px;color:#a99aa5}.archiveentry{border-bottom:1px solid #413641;padding:13px 0}.archiveentry:last-child{border:0}.fakeproof{border:1px dashed #706077;border-radius:13px;padding:27px 14px;text-align:center;color:#bcb0ba;background:#2b242e}.toast{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);max-width:440px;width:calc(100% - 30px);border-radius:13px;background:#3a2933;padding:14px;color:#f5e7df;border:1px solid #8e6978;text-align:center;z-index:8;box-shadow:0 15px 35px #0009}.watermark{margin-top:26px;text-align:center;font-size:10px;color:#796f77}.count{font-size:11px;color:var(--gold);background:#382a32;border-radius:15px;padding:4px 8px}textarea{min-height:140px;resize:vertical}
</style></head><body><div class="app"><header class="head"><div class="brand"><small>PRIVATE ACCESS · 🌹</small>DAME CAMELIAS</div><div class="mark">✦</div></header><main class="body" id="app"></main><nav class="footnav"><button class="navbtn active" id="nav-clients" onclick="root('clients')"><span class="symbol">♙</span>Клиентки</button><button class="navbtn" id="nav-reviews" onclick="root('reviews')"><span class="symbol">✉</span>Отзывы</button></nav></div><script>
// ДЕМОНСТРАЦИЯ: все записи и Telegram-ники вымышленные; реальные API не используются.
// ADMIN V3: внешний вид готов к переходу на один серверный контракт; GitHub main не изменён.
const exampleClients=[{id:'1000012345',username:'camelia_demo',active:true,grant:12,spent:4,reserved:1,agreement:true,pin:'******'},{id:'1000056789',username:'rose_client',active:true,grant:6,spent:2,reserved:0,agreement:true,pin:'******'},{id:'1000098765',username:null,active:false,grant:3,spent:1,reserved:0,agreement:false,pin:'******'}];
const examples=[{id:'r1',uid:'1000012345',profile:'421',account:'Ян Первый',date:'16.10.2026',text:'Встреча прошла приятно. Общение было доброжелательным, всё соответствовало описанию анкеты.',status:'pending',original:null},{id:'r2',uid:'1000056789',profile:'258',account:'Ян Первый',date:'15.10.2026',text:'Хочу отметить приятное общение и внимательное отношение.',status:'approved',original:null}];
const archive=[{uid:'1000012345',profile:'421',account:'Ян Первый',kind:'Оценка',date:'16.10.2026',proof:true},{uid:'1000012345',profile:'421',account:'Ян Первый',kind:'Отзыв',date:'15.10.2026',proof:true},{uid:'1000056789',profile:'258',account:'Ян Первый',kind:'Оценка',date:'15.10.2026',proof:true}];
let clients=[],reviews=[],state={page:'clients',client:null,filter:'pending',query:'',archquery:'',review:null,wizard:null,step:0,action:null,field:'',editor:'',ack:''};
const el=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cby=id=>clients.find(c=>c.id===id);const available=c=>Number.isFinite(c.available)?c.available:c.grant-c.spent-c.reserved;
// Display-only username: never an account key or authority. Null is a valid Telegram state.
const normalizeUsername=value=>typeof value==='string'&&/^[A-Za-z0-9_]{5,32}$/.test(value.replace(/^@/,''))?value.replace(/^@/,''):null;
const username=c=>normalizeUsername(c?.username)?'@'+esc(normalizeUsername(c.username)):'Ник не указан';
const clientLabel=c=>normalizeUsername(c?.username)?'<span class="strong nickname">'+username(c)+'</span><div class="light">ID '+esc(c.id)+'</div>':'<span class="strong">ID '+esc(c.id)+'</span><div class="light">Ник не указан</div>';
// Integration boundary: adapters must use EXISTING authorized server operations.
// The preview intentionally uses demo memory only; no network, secrets or Telegram actions.
const AdminDataAdapter={
  mode:'demo',
  listClients:async()=>clients.map(c=>({...c})),
  getClient:async id=>{const c=cby(String(id));return c?{...c}:null},
  listReviews:async()=>reviews.map(r=>({...r})),
  getArchive:async id=>archive.filter(a=>a.uid===String(id)).map(a=>({...a})),
  getAgreementStatus:async id=>Boolean(cby(String(id))?.agreement),
  // Production adapter: registry(create/topup/pin/suspend/resume), adjustCredits,
  // credits(status/history), cabinetRPC(admin_archive), moderationRPC; server auth required.
};const b=(label,call,css='secondary')=>`<button class="${css}" onclick="${call}">${label}</button>`;const link=(icon,label,call,right='›')=>`<button class="linkrow" onclick="${call}"><span class="linkico">${icon}</span><span class="flex">${label}</span><span class="chev">${right}</span></button>`;const go=(page,extra={})=>{Object.assign(state,{page,...extra});render();scrollTo({top:0,behavior:'instant'})};const root=(page)=>{go(page,{client:null,review:null,query:'',wizard:null,action:null,ack:''})};
const back=(call)=>`<button class="back" onclick="${call}">‹ Назад</button>`;
function render(){document.getElementById('nav-clients').classList.toggle('active',!['reviews','review'].includes(state.page));document.getElementById('nav-reviews').classList.toggle('active',['reviews','review'].includes(state.page));let p=state.page;let h='';
if(p==='clients'){let matches=clients.filter(c=>c.id.includes(state.query.trim())||(normalizeUsername(c.username)||'').toLowerCase().includes(state.query.trim().replace(/^@/,'').toLowerCase()));h=`<div class="toprow"><div><h1>Клиентки</h1><div class="muted small">Управление доступом и кредитами</div></div><button class="iconadd" aria-label="Добавить клиентку" onclick="startAdd()">+</button></div><input class="search" id="search" placeholder="⌕  Telegram ник или ID" value="${esc(state.query)}" oninput="searchClients(this.value)"><div class="section">Список клиенток <span class="muted">· ${matches.length}</span></div><div class="list">${matches.map(c=>`<button class="listitem" onclick="openClient('${c.id}')"><span class="avatar">✦</span><span class="flex">${clientLabel(c)}<div class="light"><span class="status ${c.active?'':'off'}">${c.active?'Доступ открыт':'Приостановлен'}</span> · 💎 ${available(c)} доступно</div></span><span class="chev">›</span></button>`).join('')||'<div class="empty">Клиентки не найдены</div>'}</div><div class="watermark">Данные из общей системы · Ник появится, когда Telegram его предоставит</div>`}
else if(p==='client'){let c=cby(state.client);if(!c){root('clients');return}h=`${back("root('clients')")}<div class="row"><div><h1>${username(c)}</h1><div class="small muted">Telegram ID ${esc(c.id)}</div></div><span class="status ${c.active?'':'off'}">${c.active?'Активна':'Приостановлена'}</span></div><div class="summary"><div class="mini">БАЛАНС ПУБЛИКАЦИЙ</div><div class="number">${available(c)} <span style="font:13px -apple-system;color:#e9d5bd">доступно</span></div><div class="minor"><span>Использовано <b>${c.spent}</b></span><span>В резерве <b>${c.reserved}</b></span></div></div>${b('＋  Пополнить баланс',"startAction('topup')",'primary')}<div class="section">Карточка</div><div class="links">${link('▤','Публикации и подтверждения',"openArchive()")}${link('▣',`Соглашение <span class="muted small">· ${c.agreement?'подписано':'не подписано'}</span>`,"openAgreement()")}</div><div class="section">Настройки доступа</div><div class="links">${link('⚖','Изменить остаток',"startAction('balance')")}${link('⌘','Изменить код доступа',"startAction('pin')")}${link(c.active?'◷':'▷',c.active?'Приостановить доступ':'Восстановить доступ',"startAction('access')")}</div><div class="watermark">Операции выполняются сервером и требуют подтверждения</div>`}
else if(p==='agreement'){let c=cby(state.client);h=`${back("go('client')")}<h1>Соглашение</h1><div class="card"><div class="row"><strong>Статус</strong><span class="${c.agreement?'status':'status off'}">${c.agreement?'Подписано':'Не подписано'}</span></div><div class="thin"></div><p class="small muted">${state.signedSections?state.signedSections.map(x=>'<div class="thin"></div><div class="mini">'+esc(x.title)+'</div><p class="reviewtext">'+esc(x.body)+'</p>').join('')+'<div class="thin"></div><div class="small muted">Подписан ID '+esc(state.client)+' · '+esc(state.acceptedDate||'Дата не указана')+'</div>':'Соглашение не подписано либо временно недоступно.'}</p></div>`}
else if(p==='archive'){let a=archive.filter(x=>x.uid===state.client&&(x.profile.includes(state.archquery)||x.account.toLowerCase().includes(state.archquery.toLowerCase())||x.date.includes(state.archquery)));h=`${back("go('client')")}<h1>Публикации</h1><p class="small muted">Клиентка ${esc(state.client)}</p><input class="search" placeholder="⌕  Анкета, мужчина, дата" value="${esc(state.archquery)}" oninput="searchArchive(this.value)"><div class="section">История · ${a.length}</div><div class="list">${a.map((x,i)=>`<button class="listitem" onclick="go('proof',{proof:${archive.indexOf(x)}})"><span class="avatar">${x.kind==='Оценка'?'☆':'✎'}</span><span class="flex"><span class="strong">${x.kind} · Анкета №${x.profile}</span><div class="light">${x.account} · ${x.date}</div></span><span class="chev">›</span></button>`).join('')||'<div class="empty">Подтверждения не найдены</div>'}</div>`}
else if(p==='proof'){let x=archive[state.proof];h=`${back("go('archive')")}<h1>Подтверждение</h1><div class="card"><strong>${x.kind} · анкета №${x.profile}</strong><div class="light">${x.account} · ${x.date}</div><div class="thin"></div><div class="fakeproof">▧<br>${x.proof?'<button class="secondary" onclick="loadProof()">Открыть скриншот</button><div id="proof-image" class="hint">Скриншот загружается только по вашему запросу</div>':'Скриншот не сохранён. Публикация есть в архиве.'}</div></div>`}
else if(p==='reviews'){let r=reviews.filter(x=>state.filter==='all'||(state.filter==='done'?['approved','cancelled'].includes(x.status):x.status==='pending'));h=`<div class="toprow"><div><h1>Отзывы</h1><div class="muted small">Проверка и корректировка</div></div></div><div class="chipbar"><button class="chip ${state.filter==='pending'?'selected':''}" onclick="filterReviews('pending')">Новые</button><button class="chip ${state.filter==='done'?'selected':''}" onclick="filterReviews('done')">Завершённые</button><button class="chip ${state.filter==='all'?'selected':''}" onclick="filterReviews('all')">Все</button></div><div class="list">${r.map(x=>`<button class="listitem" onclick="go('review',{review:'${x.id}',editor:''})"><span class="avatar">✎</span><span class="flex"><span class="strong">Отзыв · анкета №${x.profile}</span><div class="light">${x.account} · ${x.date}</div><div class="light">${x.status==='pending'?'Ожидает решения':x.status==='approved'?'Одобрен':'Отклонён'}</div></span><span class="chev">›</span></button>`).join('')||'<div class="empty">Нет отзывов в этой категории</div>'}</div><div class="watermark">Модерация пока доступна в прежнем ADMIN</div>`}
else if(p==='review'){let x=reviews.find(y=>y.id===state.review);h=`${back("go('reviews')")}<h1>Отзыв</h1><div class="muted small">Анкета №${x.profile} · ${x.account}</div><div class="card"><div class="row"><span class="mini">ТЕКСТ ОТЗЫВА</span><span class="date">${x.date}</span></div><div class="reviewtext">${esc(x.text)}</div>${x.original?`<div class="thin"></div><div class="muted small">Исходный текст сохранён в истории корректировок</div>`:''}</div>${x.status==='pending'?`${b('Опубликовать',"startAction('approve')",'primary')}<div style="height:9px"></div>${b('✎  Скорректировать',"startAction('edit')")}${b('Отклонить',"startAction('reject')",'secondary danger')}`:`<div class="note">${x.status==='approved'?'Решение: одобрен':'Решение: отклонён'}. Это демонстрационный статус.</div>`}`}
else if(p==='form'){h=formContent()}
else if(p==='confirm'){h=confirmContent()}
el.innerHTML=h;}
function searchClients(v){const focused=document.activeElement;state.query=v;let position=focused.selectionStart;render();const input=document.getElementById('search');if(input){input.focus();input.setSelectionRange(position,position)}}
function searchArchive(v){state.archquery=v;render();const input=el.querySelector('input');if(input){input.focus();input.setSelectionRange(v.length,v.length)}}
function filterReviews(v){state.filter=v;render()}
function startAdd(){pendingOperation=null;state.wizard={id:'',pin:'',grant:''};state.action='create';state.step=0;go('form')}
function startAction(type){pendingOperation=null;if(['approve','reject','edit'].includes(type))return toast('Модерация пока доступна в прежнем ADMIN.');state.action=type;state.field='';state.ack='';state.step=0;go(type==='access'||type==='approve'||type==='reject'?'confirm':'form')}
function actionTitle(){return ({create:'Добавить клиентку',topup:'Пополнить баланс',balance:'Изменить остаток',pin:'Новый код доступа',access:'Изменить доступ',approve:'Опубликовать отзыв',reject:'Отклонить отзыв',edit:'Скорректировать'})[state.action]}
function formContent(){let t=state.action,field=state.field;let h=`${back(t==='create'?"root('clients')":t==='edit'?"go('review')":"go('client')")}<h1>${actionTitle()}</h1>`;
if(t==='create'){let steps=[['Telegram ID','Введите числовой Telegram ID клиентки','numeric'],['Код доступа','Назначьте код из 6–12 цифр','numeric'],['Начальный баланс','Количество публикаций от 0 до 1 000 000','numeric']];let [label,hint,keyboard]=steps[state.step];let key=['id','pin','grant'][state.step];h+=`<p class="muted small">Шаг ${state.step+1} из 3</p><div class="card"><label>${label}</label><input class="field" inputmode="${keyboard}" type="${key==='pin'?'password':'text'}" id="entry" value="${esc(state.wizard[key])}" placeholder="${esc(hint)}" oninput="state.wizard['${key}']=this.value"><div class="hint">${hint}</div><div id="err" class="error"></div>${b(state.step===2?'Проверить и подтвердить':'Продолжить','nextCreate()','primary')}</div>`;}
if(['topup','balance','pin'].includes(t)){let label=t==='pin'?'Новый код (6–12 цифр)':t==='topup'?'Сколько публикаций добавить?':'Новый доступный остаток';h+=`<p class="small muted">Клиентка ${esc(state.client)}</p><div class="card"><label>${label}</label><input class="field" id="entry" ${t==='pin'?'type="password"':''} inputmode="numeric" placeholder="Введите значение" value="${esc(state.field)}" oninput="state.field=this.value"><div class="hint">${t==='balance'?'Текущий остаток и уже использованные публикации учитываются отдельно.':t==='topup'?'Добавление публикаций, не замена остатка.':'После изменения потребуется повторный вход.'}</div><div id="err" class="error"></div>${b('Проверить и подтвердить',"validateAction()",'primary')}</div>`;}
if(t==='edit'){let x=reviews.find(x=>x.id===state.review);h+=`<p class="muted small">Анкета №${x.profile}</p><div class="card"><label>Исправленный текст</label><textarea class="field" id="entry" oninput="state.editor=this.value">${esc(state.editor||x.text)}</textarea><div id="err" class="error"></div>${b('Проверить корректировку',"validateEdit()",'primary')}</div>`;}
return h;}
function fail(text){let e=document.getElementById('err');if(e)e.textContent=text}
function nextCreate(){let w=state.wizard,k=['id','pin','grant'][state.step],v=document.getElementById('entry').value;w[k]=v;if(k==='id'&&(!/^[1-9]\d{4,15}$/.test(v)||clients.some(c=>c.id===v))){fail('Проверьте ID: требуется уникальный числовой Telegram ID.');return}if(k==='pin'&&!/^\d{6,12}$/.test(v)){fail('Код должен содержать 6–12 цифр.');return}if(k==='grant'&&(!/^\d+$/.test(v)||+v>1000000)){fail('Введите целое число от 0 до 1 000 000.');return}if(state.step<2){state.step++;render()}else go('confirm')}
function validateAction(){let t=state.action,v=document.getElementById('entry').value;state.field=v;if(t==='pin'&&!/^\d{6,12}$/.test(v))return fail('Код должен содержать 6–12 цифр.');if(t!=='pin'&&(!/^\d+$/.test(v)||+v>1000000||(t==='topup'&&+v===0)))return fail('Проверьте целое число в допустимом диапазоне.');go('confirm')}
function validateEdit(){let v=document.getElementById('entry').value.trim();if(v.length<10||v.length>3000)return fail('Текст отзыва должен содержать от 10 до 3000 символов.');state.editor=v;go('confirm')}
function confirmContent(){let t=state.action,c=cby(state.client),x=reviews.find(y=>y.id===state.review);let intro='';if(t==='create')intro=`ID: ${state.wizard.id}<br>Начальный баланс: ${state.wizard.grant}<br>Код: ••••••`;if(t==='topup')intro=`${username(c)} · ID ${esc(c.id)}<br>Добавить: <b>${state.field}</b> публикаций<br>Остаток сейчас: ${available(c)}`;if(t==='balance')intro=`${username(c)} · ID ${esc(c.id)}<br>Сейчас: ${available(c)}<br>Установить: <b>${state.field}</b>`;if(t==='pin')intro=`${username(c)} · ID ${esc(c.id)}<br>Изменить код доступа`;if(t==='access')intro=`${username(c)} · ID ${esc(c.id)}<br>${c.active?'Приостановить доступ':'Восстановить доступ'}`;if(['approve','reject','edit'].includes(t))intro=`Анкета №${x.profile}<br>${x.account}<br>${t==='edit'?'Сохранить исправленный текст':t==='approve'?'Подтвердить публикацию':'Отклонить отзыв'}`;let returnTo=t==='create'?"root('clients')":['edit','approve','reject'].includes(t)?"go('review')":"go('client')";return `${back(returnTo)}<h1>Подтверждение</h1><p class="muted small">${actionTitle()}</p><div class="card" style="line-height:1.9">${intro}</div><div class="note">Операция будет записана в существующую систему после подтверждения.</div>${b('Подтвердить',"commitLive()",'primary')}<div style="height:9px"></div>${b('Отмена',returnTo)}`}

const auth=()=>window.Telegram?.WebApp?.initData||'';
async function callAdmin(action,payload={}){
 if(!auth())throw Error('Откройте ADMIN из вашего Telegram-бота');
 const response=await fetch('/api/admin/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:auth(),action,...payload}),cache:'no-store'});
 const data=await response.json().catch(()=>({reason:'network_error'}));
 if(!response.ok||!data.ok)throw Error(data.reason||'operation_unavailable');
 return data;
}
async function reloadClients(){
 try{
  const data=await callAdmin('clients');
  clients=data.clients.filter(c=>!c.financeUnavailable).map(c=>({...c,username:c.username||null,agreement:false}));
  state.page='clients';render();
 }catch(e){clients=[];reviews=[];render();toast('ADMIN недоступен: '+e.message)}
}
async function openClient(id){
 try{
  const r=await callAdmin('client',{userId:id});
  const i=clients.findIndex(c=>c.id===id);
  if(i<0)throw Error('not_found');
  clients[i]={...clients[i],...r.client,agreement:r.client.agreement?.status==='accepted'};
  go('client',{client:id});
 }catch(e){toast('Не удалось открыть клиентку: '+e.message)}
}
async function openAgreement(){
 state.signedSections=null;state.acceptedDate=null;
 try{
  const r=await callAdmin('agreement_view',{userId:state.client});
  if(r.agreement?.status==='accepted'){
   state.signedSections=Array.isArray(r.agreement.sections)?r.agreement.sections:[];
   state.acceptedDate=r.agreement.acceptedAt?new Date(r.agreement.acceptedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'}):null;
  }
  go('agreement');
 }catch(e){toast('Соглашение недоступно: '+e.message)}
}
async function loadProof(){
 const x=archive[state.proof],target=document.getElementById('proof-image');
 if(!x||!target)return;
 target.textContent='Загружаем подтверждение…';
 try{
  const response=await fetch('/api/admin/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:auth(),action:'archive_proof',userId:x.uid,profileId:x.profile,account:x.account,kind:x.kindKey}),cache:'no-store'});
  if(!response.ok||!(response.headers.get('content-type')||'').startsWith('image/'))throw Error('Скриншот недоступен');
  const blob=await response.blob(),url=URL.createObjectURL(blob);
  target.innerHTML='<img alt="Подтверждение публикации" style="width:100%;height:auto;max-height:75vh;object-fit:contain;border-radius:12px">';
  target.querySelector('img').src=url;
  target.querySelector('img').onload=()=>URL.revokeObjectURL(url);
 }catch(e){target.textContent=e.message}
}
async function openArchive(){
 try{
  const r=await callAdmin('archive',{userId:state.client});
  archive.length=0;
  for(const x of (r.archive?.items||[]))archive.push({uid:state.client,profile:String(x.profileId||''),account:x.account||'',kind:x.kind==='rating'?'Оценка':'Отзыв',date:String(x.date||''),proof:!!x.fileId,kindKey:x.kind,fileId:null});
  go('archive',{archquery:''});
 }catch(e){toast('Не удалось открыть архив: '+e.message)}
}
let pendingOperation=null,busy=false;
function nonce16(){return Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('')}
async function commitLive(){
 if(busy)return;busy=true;
 const t=state.action,c=cby(state.client),operation=pendingOperation||(pendingOperation=nonce16());
 const button=el.querySelector('.primary');if(button)button.disabled=true;
 try{
  let action=t,payload={operation,userId:state.client};
  if(t==='create')payload={operation,userId:state.wizard.id,pin:state.wizard.pin,grant:Number(state.wizard.grant)};
  if(t==='topup')payload.amount=Number(state.field);
  if(t==='balance'){payload.target=Number(state.field);payload.expected=available(c)}
  if(t==='pin')payload.pin=state.field;
  if(t==='access')action=c.active?'suspend':'resume';
  if(!['create','topup','balance','pin','access'].includes(t))throw Error('action_not_connected');
  await callAdmin(action,payload);
  pendingOperation=null;await reloadClients();
  if(clients.some(c=>c.id===payload.userId))await openClient(payload.userId);
  toast('Изменения сохранены');
 }catch(e){toast('Ошибка сохранения: '+e.message)}
 finally{busy=false;if(button)button.disabled=false}
}
function toast(t){let old=document.querySelector('.toast');old?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.querySelector('.app').appendChild(d);setTimeout(()=>d.remove(),2400)}reloadClients();
</script></body></html>
