name = "dame-camelias"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Cloudflare Git-linked rebuild requested for all 29 secondary account review proxy isolation (2026-10-21)

# Visitor events are viewed inside ADMINISTRATION. Telegram reports disabled.
# Profile thumbnails share existing VISITORS_KV namespace (no R2 bucket required).
[[kv_namespaces]]
binding = "VISITORS_KV"
id = "a323fba4c8c84a7fb37e1e6a3a8264aa"

[[durable_objects.bindings]]
name = "ORDER_REMINDERS"
class_name = "OrderReminder"

[[migrations]]
tag = "order-reminders-v1"
new_sqlite_classes = ["OrderReminder"]

# Owner-approved publication testing with manual confirmation in Telegram.
[vars]
CABINET_CLIENTS_ENABLED = "true"
CABINET_PUBLICATIONS_ENABLED = "true"
# Public callback endpoint; authentication remains ANKETA_CALLBACK_TOKEN secret.
ANKETA_CALLBACK_URL = "https://dame-camelias.gptjjjgpt.workers.dev/api/anketa/result"

