name: Universal client cabinet regression
on:
  push:
    branches: [feat/multi-client-isolation-foundation]
    paths: ['src/**', 'tools/**', 'tests/**', '.github/workflows/multi-client-cabinet.yml']
  pull_request:
    paths: ['src/**', 'tools/**', 'tests/**', '.github/workflows/multi-client-cabinet.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every Worker module
        run: |
          for file in src/*.js; do node --check "$file"; done
          node -e "import('./src/index.js')"
      - name: Test cabinet, ledgers, authorization and existing bot regressions
        run: node --test tests/*.test.mjs
      - name: Test Python publication safety without network or real publication
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m py_compile tools/*.py
